<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Process Form</title>
    <link rel="stylesheet" th:href="@{/css/Style.css}" />
</head>

<body>

    <p th:if="${param.studentName != null and !#strings.isEmpty(param.studentName[0])}">
        Student Name :
        <span th:text="${param.studentName}"></span>
    </p>

    <p th:if="${message != null and !#strings.isEmpty(message)}">
        Student Name :
        <span th:text="${message}"></span>
    </p>

</body>
</html>
