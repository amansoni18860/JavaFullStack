<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Student Confirmation</title>

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

</head>

<body class="bg-light">

	<div class="container mt-5">

		<div class="card shadow-lg p-4">

			<h2 class="text-success text-center mb-4">Registration
				Successful ✅</h2>

			<table class="table table-bordered">

				<tr>
					<th>First Name</th>
					<td th:text="${student.firstName}"></td>
				</tr>

				<tr>
					<th>Last Name</th>
					<td th:text="${student.lastName}"></td>
				</tr>

				<tr>
					<th>Country</th>
					<td th:text="${student.country}"></td>
				</tr>

				<tr>
					<th>Gender</th>
					<td th:text="${student.gender}"></td>
				</tr>

				<tr>
					<th>Favorite Languages</th>
					<td th:text="${student.favoriteLanguages}"></td>
				</tr>

			</table>

			<a th:href="@{/showForm}" class="btn btn-primary"> Register
				Another Student </a>

		</div>

	</div>

</body>
</html>
