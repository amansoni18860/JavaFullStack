<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Student Registration</title>

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

<style>
body {
	background: linear-gradient(to right, #667eea, #764ba2);
	min-height: 100vh;
}

.form-card {
	max-width: 700px;
	margin: auto;
	margin-top: 50px;
	background: white;
	padding: 35px;
	border-radius: 20px;
	box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
}
</style>

</head>

<body>

	<div class="container">

		<div class="form-card">

			<h2 class="text-center text-primary mb-4">Student Registration
				Form</h2>

			<form th:action="@{/processForm}" th:object="${student}"
				method="post">

				<div class="mb-3">
					<label class="form-label"> First Name </label> <input type="text"
						class="form-control" th:field="*{firstName}">
				</div>

				<div class="mb-3">
					<label class="form-label"> Last Name </label> <input type="text"
						class="form-control" th:field="*{lastName}">
				</div>

				<div class="mb-3">
					<label class="form-label"> Country </label> <select
						class="form-select" th:field="*{country}">

						<option value="">Select Country</option>
						<option value="India">India</option>
						<option value="USA">USA</option>
						<option value="Canada">Canada</option>
						<option value="Australia">Australia</option>
						<option value="Germany">Germany</option>

					</select>
				</div>

				<div class="mb-3">

					<label class="form-label"> Gender </label>

					<div class="form-check">
						<input class="form-check-input" type="radio" th:field="*{gender}"
							value="Male"> <label class="form-check-label">
							Male </label>
					</div>

					<div class="form-check">
						<input class="form-check-input" type="radio" th:field="*{gender}"
							value="Female"> <label class="form-check-label">
							Female </label>
					</div>

				</div>

				<div class="mb-3">

					<label class="form-label"> Favorite Languages </label>

					<div class="form-check">
						<input class="form-check-input" type="checkbox"
							th:field="*{favoriteLanguages}" value="Java"> <label
							class="form-check-label"> Java </label>
					</div>

					<div class="form-check">
						<input class="form-check-input" type="checkbox"
							th:field="*{favoriteLanguages}" value="Python"> <label
							class="form-check-label"> Python </label>
					</div>

					<div class="form-check">
						<input class="form-check-input" type="checkbox"
							th:field="*{favoriteLanguages}" value="JavaScript"> <label
							class="form-check-label"> JavaScript </label>
					</div>

				</div>

				<button type="submit" class="btn btn-success w-100">Submit
				</button>

			</form>

		</div>
	</div>
</body>
</html>
